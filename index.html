<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>29 колец</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0a08;
    --hud-text: rgba(255, 238, 222, 0.62);
    --hud-dim: rgba(255, 238, 222, 0.34);
    --accent: #ffc58f;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    left: max(18px, env(safe-area-inset-left));
    padding: 12px 14px 11px;
    min-width: 150px;
    border-radius: 10px;
    background: rgba(255, 240, 225, 0.035);
    border: 1px solid rgba(255, 240, 225, 0.06);
    color: var(--hud-text);
    font-size: 13px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  #hud-count b {
    color: rgba(255, 244, 232, 0.9);
    font-weight: 600;
  }

  .hud-speed {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 9px;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--hud-dim);
  }

  .hud-bar {
    position: relative;
    flex: 1;
    height: 2px;
    border-radius: 1px;
    background: rgba(255, 240, 225, 0.1);
    overflow: hidden;
  }

  #hud-bar-fill {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #ff9d6b, #ffd28f);
    transform-origin: left center;
    transform: scaleX(0);
  }

  #hud-years {
    max-height: 0;
    opacity: 0;
    transform: translateY(4px);
    overflow: hidden;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(255, 180, 110, 0.45);
    transition: max-height 0.6s ease, opacity 0.8s ease 0.15s, transform 0.8s ease 0.15s, margin-top 0.6s ease;
  }

  #hud.done #hud-years {
    max-height: 40px;
    margin-top: 8px;
    opacity: 1;
    transform: none;
  }

  #hud.flash {
    animation: hud-flash 1.3s ease-out;
  }

  @keyframes hud-flash {
    0% {
      background: rgba(255, 214, 170, 0.32);
      border-color: rgba(255, 214, 170, 0.6);
      box-shadow: 0 0 46px rgba(255, 180, 110, 0.45);
      color: #fff;
    }
    100% {
      background: rgba(255, 240, 225, 0.035);
      border-color: rgba(255, 240, 225, 0.06);
      box-shadow: 0 0 0 rgba(255, 180, 110, 0);
      color: var(--hud-text);
    }
  }

  #hint {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(16px, env(safe-area-inset-bottom));
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: rgba(255, 238, 222, 0.24);
    pointer-events: none;
    padding: 0 16px;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" aria-live="polite">
  <div id="hud-count">Кольцо <b>0</b> / 29</div>
  <div class="hud-speed">
    <span>скорость</span>
    <div class="hud-bar"><div id="hud-bar-fill"></div></div>
  </div>
  <div id="hud-years">29 лет</div>
</div>

<div id="hint">ближе к центру — быстрее · клик или пробел — заново</div>

<script>
'use strict';

// =====================================================================
// CONFIG — все настройки в одном месте
// =====================================================================
const CONFIG = {
  ringCount: 29,              // число колец (= лет компании)
  outerRadiusRatio: 0.9,      // последнее кольцо = 90% от min(w, h) / 2

  // Цвета (HSL, сдвиг оттенка на золотой угол)
  hueStart: 18,               // тёплый стартовый оттенок
  hueStep: 137.508,           // золотой угол
  saturation: 72,
  lightness: 63,

  // Линии и свечение
  lineWidthMin: 3,            // толщина внутреннего кольца, px
  lineWidthMax: 5,            // толщина внешнего кольца, px
  glowWidthFactor: 2.4,       // ширина «свечения» относительно линии
  glowAlpha: 0.22,            // прозрачность прохода свечения

  // Появление колец
  appearDuration: 400,        // мс: рост радиуса + fade-in
  intervalMin: 80,            // мс между кольцами, мышь в центре
  intervalMax: 1000,          // мс между кольцами, мышь у края
  intervalCurvePower: 2,      // нелинейность (2 = квадратичная)
  speedSmoothing: 180,        // мс, постоянная времени сглаживания скорости
  idlePointerDistance: 0.5,   // нормализованное расстояние, пока мышь не двигалась

  // Пульсация после появления всех колец
  pulseAmplitude: 0.03,       // масштаб 1 ± 0.03
  pulseFrequency: 0.45,       // Гц
  pulsePhaseShift: 0.16,      // рад на кольцо: волна от центра наружу
  pulseFadeIn: 1800,          // мс плавного старта пульсации

  // Указатель вокруг курсора
  pointerRadius: 18,

  // Защита от больших скачков времени (вкладка в фоне и т.п.)
  maxDeltaTime: 100,

  // Фон
  bgInner: '#16110d',
  bgOuter: '#0a0807',
  vignetteStrength: 0.6,
};

// =====================================================================
// Состояние
// =====================================================================
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

const hud = document.getElementById('hud');
const hudCount = document.getElementById('hud-count');
const hudBarFill = document.getElementById('hud-bar-fill');
const hudYears = document.getElementById('hud-years');

const N = CONFIG.ringCount;

const view = {
  width: 0, height: 0, dpr: 1,
  cx: 0, cy: 0,
  maxRadius: 0,       // радиус последнего кольца
  cornerDist: 1,      // расстояние от центра до угла (для нормализации)
  bgGradient: null,
  vignette: null,
};

const pointer = {
  x: 0, y: 0,
  known: false,       // курсор/палец хоть раз появлялся
  active: false,      // сейчас над канвасом / палец прижат
  alpha: 0,           // сглаженная видимость кольца-указателя
};

const state = {
  time: 0,                              // собственные часы анимации, мс
  visible: 0,                           // Уровень 2: счётчик появившихся колец
  spawnProgress: 1,                     // Уровень 2: накопленная доля интервала
  birthTimes: new Float64Array(N),      // когда каждое кольцо начало появляться
  interval: CONFIG.intervalMax,         // Уровень 3: текущий (сглаженный) интервал
  targetInterval: CONFIG.intervalMax,
  pulseStart: -1,                       // когда стартовала пульсация (-1 = нет)
  hudShown: -1,                         // что сейчас выведено в HUD (чтобы не трогать DOM зря)
  hudBar: -1,
};

// Уровень 1: цвета колец — HSL со сдвигом оттенка на золотой угол.
// Одинаковые насыщенность/яркость дают гармонию, золотой угол — контраст соседей.
const ringColors = Array.from({ length: N }, (_, i) => {
  const hue = (CONFIG.hueStart + i * CONFIG.hueStep) % 360;
  return `hsl(${hue.toFixed(1)}, ${CONFIG.saturation}%, ${CONFIG.lightness}%)`;
});

// =====================================================================
// Утилиты
// =====================================================================
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const smoothstep = (t) => t * t * (3 - 2 * t);

function yearsWord(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return 'год';
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'года';
  return 'лет';
}

// =====================================================================
// resize — размеры, devicePixelRatio, кэш градиентов
// =====================================================================
function resize() {
  view.dpr = Math.min(window.devicePixelRatio || 1, 3);
  view.width = window.innerWidth;
  view.height = window.innerHeight;

  canvas.width = Math.round(view.width * view.dpr);
  canvas.height = Math.round(view.height * view.dpr);

  view.cx = view.width / 2;
  view.cy = view.height / 2;
  // Уровень 1: последнее кольцо ≈ 90% от min(w, h) / 2 — узор всегда влезает
  view.maxRadius = CONFIG.outerRadiusRatio * Math.min(view.width, view.height) / 2;
  view.cornerDist = Math.max(1, Math.hypot(view.cx, view.cy));

  // Фон: почти чёрный, чуть тёплый, светлее к центру
  const bg = ctx.createRadialGradient(view.cx, view.cy, 0, view.cx, view.cy, view.cornerDist);
  bg.addColorStop(0, CONFIG.bgInner);
  bg.addColorStop(1, CONFIG.bgOuter);
  view.bgGradient = bg;

  // Виньетка поверх колец
  const v = ctx.createRadialGradient(
    view.cx, view.cy, Math.min(view.width, view.height) * 0.3,
    view.cx, view.cy, view.cornerDist
  );
  v.addColorStop(0, 'rgba(0, 0, 0, 0)');
  v.addColorStop(1, `rgba(0, 0, 0, ${CONFIG.vignetteStrength})`);
  view.vignette = v;
}

// =====================================================================
// Ввод: мышь и touch через Pointer Events
// =====================================================================
function setPointer(e) {
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  pointer.known = true;
  pointer.active = true;
}

function releasePointer(e) {
  // Мышь остаётся «активной», пока над окном; палец — пока прижат
  if (e.type === 'pointerleave' || e.pointerType !== 'mouse') pointer.active = false;
}

canvas.addEventListener('pointermove', setPointer);
canvas.addEventListener('pointerdown', setPointer);
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('pointerleave', releasePointer);

// Клик / тап — перезапуск
canvas.addEventListener('click', restart);

// Пробел — перезапуск
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (!e.repeat) restart();
  }
});

window.addEventListener('resize', resize);

// =====================================================================
// restart — начать всё с нуля
// =====================================================================
function restart() {
  state.visible = 0;
  state.spawnProgress = 1;     // первое кольцо — сразу
  state.pulseStart = -1;
  state.birthTimes.fill(0);
  state.hudShown = -1;
  hud.classList.remove('flash', 'done');
}

// =====================================================================
// Уровень 3: нормализованное расстояние курсора до центра [0..1]
// =====================================================================
function pointerDistanceNorm() {
  if (!pointer.known) return CONFIG.idlePointerDistance;
  const d = Math.hypot(pointer.x - view.cx, pointer.y - view.cy);
  return clamp(d / view.cornerDist, 0, 1);
}

// =====================================================================
// update — логика кадра
// =====================================================================
function update(dt) {
  state.time += dt;

  // Уровень 3: целевой интервал — нелинейно (квадратично) от расстояния до центра
  const d = pointerDistanceNorm();
  state.targetInterval = lerp(
    CONFIG.intervalMin,
    CONFIG.intervalMax,
    Math.pow(d, CONFIG.intervalCurvePower)
  );

  // Уровень 3: сглаживание скорости (frame-rate independent lerp)
  const k = 1 - Math.exp(-dt / CONFIG.speedSmoothing);
  state.interval = lerp(state.interval, state.targetInterval, k);

  // Уровень 2: таймер на requestAnimationFrame с накоплением delta time.
  // Копим dt в долях текущего интервала — при смене скорости на лету
  // накопленный прогресс сохраняется, поэтому рывков нет.
  if (state.visible < N) {
    state.spawnProgress += dt / state.interval;
    if (state.spawnProgress >= 1) {
      state.spawnProgress = Math.min(state.spawnProgress - 1, 1); // не больше одного кольца за кадр
      spawnRing();
    }
  }

  // Уровень 3: как только последнее кольцо доросло — запускаем пульсацию
  if (state.visible === N && state.pulseStart < 0) {
    if (state.time - state.birthTimes[N - 1] >= CONFIG.appearDuration) {
      state.pulseStart = state.time;
    }
  }

  // Плавное появление/исчезновение указателя
  const pk = 1 - Math.exp(-dt / 120);
  pointer.alpha = lerp(pointer.alpha, pointer.active ? 1 : 0, pk);

  updateHud();
}

// Уровень 2: добавить следующее кольцо
function spawnRing() {
  state.birthTimes[state.visible] = state.time;
  state.visible++;

  if (state.visible === N) {
    // Вспышка по HUD и надпись «29 лет»
    hud.classList.remove('flash');
    void hud.offsetWidth; // перезапуск CSS-анимации
    hud.classList.add('flash', 'done');
  }
}

// HUD: трогаем DOM только при изменениях
function updateHud() {
  if (state.hudShown !== state.visible) {
    state.hudShown = state.visible;
    hudCount.innerHTML = `Кольцо <b>${state.visible}</b> / ${N}`;
  }

  const speed = (CONFIG.intervalMax - state.interval) / (CONFIG.intervalMax - CONFIG.intervalMin);
  const s = clamp(speed, 0, 1);
  if (Math.abs(s - state.hudBar) > 0.002) {
    state.hudBar = s;
    hudBarFill.style.transform = `scaleX(${Math.max(0.03, s).toFixed(3)})`;
  }
}

// =====================================================================
// draw — отрисовка кадра
// =====================================================================
function draw() {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // Фон
  ctx.fillStyle = view.bgGradient;
  ctx.fillRect(0, 0, view.width, view.height);

  drawRings();

  // Виньетка
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = view.vignette;
  ctx.fillRect(0, 0, view.width, view.height);

  drawPointer();
}

function drawRings() {
  // Уровень 1: шаг радиуса от размера окна
  const step = view.maxRadius / N;
  // На маленьких экранах не даём линиям слипаться
  const widthCap = Math.max(1.2, step * 0.55);

  // Уровень 3: пульсация с плавным стартом
  let pulseMix = 0;
  let pulseTime = 0;
  if (state.pulseStart >= 0) {
    pulseTime = state.time - state.pulseStart;
    pulseMix = smoothstep(clamp(pulseTime / CONFIG.pulseFadeIn, 0, 1));
  }
  const omega = 2 * Math.PI * CONFIG.pulseFrequency / 1000; // рад/мс

  for (let i = 0; i < state.visible; i++) {
    // Уровень 2: анимация появления — easeOutCubic по радиусу, fade-in по альфе
    const p = clamp((state.time - state.birthTimes[i]) / CONFIG.appearDuration, 0, 1);
    const eased = easeOutCubic(p);

    const rFrom = step * i;          // вырастает от предыдущего кольца
    const rTo = step * (i + 1);
    let r = lerp(rFrom, rTo, eased);

    // Уровень 3: волна 1 ± A по синусу, фазовый сдвиг растёт наружу
    if (pulseMix > 0) {
      r *= 1 + CONFIG.pulseAmplitude * pulseMix *
        Math.sin(omega * pulseTime - i * CONFIG.pulsePhaseShift);
    }
    if (r <= 0) continue;

    const lw = Math.min(lerp(CONFIG.lineWidthMin, CONFIG.lineWidthMax, i / (N - 1)), widthCap);

    ctx.beginPath();
    ctx.arc(view.cx, view.cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = ringColors[i];

    // Проход 1: мягкое свечение — широкая полупрозрачная линия
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = p * CONFIG.glowAlpha;
    ctx.lineWidth = lw * CONFIG.glowWidthFactor;
    ctx.stroke();

    // Проход 2: основная линия
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = p;
    ctx.lineWidth = lw;
    ctx.stroke();
  }
}

// Уровень 3: кольцо-указатель вокруг курсора, яркость = близость к центру
function drawPointer() {
  if (pointer.alpha < 0.01 || !pointer.known) return;

  const closeness = 1 - pointerDistanceNorm();
  const a = pointer.alpha * (0.12 + 0.68 * Math.pow(closeness, 1.5));
  const r = CONFIG.pointerRadius;

  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = 'rgb(255, 232, 210)';
  ctx.fillStyle = 'rgb(255, 232, 210)';

  // Мягкий ореол
  ctx.globalAlpha = a * 0.25;
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(pointer.x, pointer.y, r, 0, Math.PI * 2);
  ctx.stroke();

  // Тонкое кольцо
  ctx.globalAlpha = a;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // Точка в центре
  ctx.globalAlpha = a * 0.8;
  ctx.beginPath();
  ctx.arc(pointer.x, pointer.y, 1.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
}

// =====================================================================
// Главный цикл (requestAnimationFrame + delta time)
// =====================================================================
let lastTimestamp = null;

function frame(ts) {
  if (lastTimestamp === null) lastTimestamp = ts;
  const dt = clamp(ts - lastTimestamp, 0, CONFIG.maxDeltaTime);
  lastTimestamp = ts;

  update(dt);
  draw();

  requestAnimationFrame(frame);
}

// Старт
hudYears.textContent = `${N} ${yearsWord(N)}`;
resize();
restart();
requestAnimationFrame(frame);
</script>
</body>
</html>
